<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraj | G L I T C H</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Space+Mono&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: 'Space Mono', monospace;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            width: 100%;
            padding: 2rem;
            position: relative;
        }

        /* Pure CSS Glitch effect on header */
        .glitch {
            font-family: 'Oswald', sans-serif;
            font-size: 6rem;
            font-weight: 700;
            text-transform: uppercase;
            position: relative;
            color: white;
            line-height: 1;
            margin: 0 0 2rem 0;
        }

        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
        }

        .glitch::before {
            left: 3px;
            text-shadow: -2px 0 red;
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -3px;
            text-shadow: -2px 0 cyan;
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 81px, 0); transform: skew(0.8deg); }
            20% { clip: rect(61px, 9999px, 12px, 0); transform: skew(0.2deg); }
            40% { clip: rect(32px, 9999px, 96px, 0); transform: skew(0.5deg); }
            60% { clip: rect(82px, 9999px, 20px, 0); transform: skew(0.1deg); }
            80% { clip: rect(98px, 9999px, 53px, 0); transform: skew(0.6deg); }
            100% { clip: rect(4px, 9999px, 78px, 0); transform: skew(0.3deg); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(65px, 9999px, 100px, 0); transform: skew(0.1deg); }
            20% { clip: rect(2px, 9999px, 25px, 0); transform: skew(0.9deg); }
            40% { clip: rect(88px, 9999px, 60px, 0); transform: skew(0.2deg); }
            60% { clip: rect(15px, 9999px, 90px, 0); transform: skew(0.6deg); }
            80% { clip: rect(45px, 9999px, 10px, 0); transform: skew(0.4deg); }
            100% { clip: rect(70px, 9999px, 80px, 0); transform: skew(0.8deg); }
        }

        .desc {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            border-left: 4px solid red;
            padding-left: 20px;
            background: rgba(255,0,0,0.05);
            transition: all 0.3s;
        }
        .desc:hover { background: rgba(0,255,255,0.05); border-color: cyan; }

        .tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 3rem; }
        .tag { 
            background: #fff; color: #111; padding: 5px 15px; 
            font-weight: bold; text-transform: uppercase;
            position: relative;
        }
        .tag:hover { background: red; color: #fff; }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        a {
            color: #fff;
            text-decoration: none;
            font-size: 2rem;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        a::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; width: 100%; height: 2px;
            background: cyan;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s;
        }

        a:hover { padding-left: 20px; color: cyan; border-color: cyan; }
        a:hover::before { transform: scaleX(1); transform-origin: left; }

        @media (max-width: 768px) {
            .glitch { font-size: 3.5rem; }
            a { font-size: 1.5rem; }
            .desc { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="glitch" data-text="SURAJ MONDAL">SURAJ MONDAL</h1>
        
        <div class="desc">
            Full-Stack Mobile Developer // BCA Student<br>
            Building real applications and shipping hackathon projects. I vibe-code with AI to construct the future, dreaming of SAO-like digital VR worlds.
        </div>

        <div class="tags">
            <div class="tag">React Native</div>
            <div class="tag">Python</div>
            <div class="tag">JavaScript</div>
            <div class="tag">AI Prompting</div>
        </div>

        <div class="links">
            <a href="https://works-mauve.vercel.app/"><span>WORKS</span> <span>↗</span></a>
            <a href="https://claydev.site/"><span>BLOGS</span> <span>↗</span></a>
            <a href="https://github.com/Clay990/Projects"><span>GITHUB</span> <span>↗</span></a>
            <a href="https://docs.google.com/document/d/1fg4KpN7jr6UFXto03ixI59kpGdYQtyY4lyXxO57Fuyo"><span>RESUME</span> <span>↗</span></a>
        </div>
    </div>
</body>
</html>
